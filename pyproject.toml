[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-shot-classifier"
version = "0.1.0"
description = "Learn video CNNs with a two-class basketball baseline"
requires-python = ">=3.10,<3.14"
dependencies = ["torch==2.9.1", "torchvision==0.24.1", "opencv-python-headless==4.12.0.88"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["shot_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
